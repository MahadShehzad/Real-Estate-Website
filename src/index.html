<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('onlinestore-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <title>Shopnest</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c3d33">
  <meta name="description" content="Shopnest — a multi-vendor marketplace.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(160deg, #5c3d33 0%, #2e1811 100%);
      transition: opacity .45s ease, visibility .45s ease;
    }
    #app-splash.app-splash--done { opacity: 0; visibility: hidden; pointer-events: none; }
    #app-splash svg { animation: app-splash-pulse 1.5s ease-in-out infinite; }
    #app-splash span {
      font-family: "Sora", "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.15rem;
      color: #fff;
    }
    @keyframes app-splash-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash svg { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <svg width="56" height="56" viewBox="0 0 64 64" role="img" aria-label="Shopnest">
      <polygon points="32,6 54.5,19 54.5,45 32,58 9.5,45 9.5,19" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" />
      <path d="M22 28h20a2 2 0 0 1 2 2v14a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3V30a2 2 0 0 1 2-2z" fill="#eac9c1" />
      <path d="M26 28c0-5 2.5-8 6-8s6 3 6 8" fill="none" stroke="#eac9c1" stroke-width="2.6" stroke-linecap="round" />
      <circle cx="32" cy="36" r="2.2" fill="#ffffff" />
    </svg>
    <span>Shopnest</span>
  </div>
  <app-root></app-root>
</body>
</html>
